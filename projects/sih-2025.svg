<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sihBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f141c"/>
      <stop offset="100%" stop-color="#090c10"/>
    </linearGradient>
    <pattern id="sihGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#sihBg)"/>
  <rect width="800" height="500" fill="url(#sihGrid)"/>
  
  <rect x="30" y="30" width="740" height="440" rx="8" fill="none" stroke="#1f2937" stroke-width="1.5"/>
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#60a5fa">TEAM XANDERS // SMART INDIA HACKATHON 2025</text>
  
  <!-- Architectural diagram nodes -->
  <g transform="translate(80, 100)">
    <!-- Node 1: Input / Sensor -->
    <rect x="30" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="50" y="110" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">Data Ingestion</text>
    <text x="50" y="130" font-family="monospace" font-size="11" fill="#94a3b8">Real-time Stream</text>
    
    <!-- Arrow 1 -->
    <path d="M 180 115 L 250 115" stroke="#3b82f6" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="250,115 242,110 242,120" fill="#3b82f6"/>
    
    <!-- Node 2: Core Processing / Unity Runtime -->
    <rect x="250" y="50" width="180" height="130" rx="8" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <text x="270" y="80" font-family="monospace" font-size="14" font-weight="bold" fill="#10b981">CORE ENGINE</text>
    <text x="270" y="105" font-family="monospace" font-size="11" fill="#e2e8f0">• State Machine</text>
    <text x="270" y="125" font-family="monospace" font-size="11" fill="#e2e8f0">• Interactive Logic</text>
    <text x="270" y="145" font-family="monospace" font-size="11" fill="#e2e8f0">• C# Runtime Systems</text>
    <text x="270" y="165" font-family="monospace" font-size="10" fill="#6ee7b7">Zero-alloc event loop</text>
    
    <!-- Arrow 2 -->
    <path d="M 430 115 L 500 115" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="500,115 492,110 492,120" fill="#10b981"/>
    
    <!-- Node 3: Simulation Viewport -->
    <rect x="500" y="80" width="150" height="70" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="520" y="110" font-family="monospace" font-size="13" font-weight="bold" fill="#f8fafc">Presentation</text>
    <text x="520" y="130" font-family="monospace" font-size="11" fill="#fbbf24">Interactive GUI/3D</text>
    
    <!-- Signal pulse waveform -->
    <path d="M 60 210 Q 110 180 160 210 T 260 210 T 360 210 T 460 210 T 560 210 T 660 210" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6"/>
  </g>
  
  <text x="50" y="435" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">SMART INDIA HACKATHON 2025</text>
  <text x="50" y="455" font-family="monospace" font-size="12" fill="#94a3b8">Team XANDERS · Rapid Team Prototyping · Systems &amp; Simulation Logic</text>
  <rect x="640" y="420" width="100" height="26" rx="4" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
  <text x="652" y="437" font-family="monospace" font-size="11" fill="#60a5fa">NATIONAL JAM</text>
</svg>