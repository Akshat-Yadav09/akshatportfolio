<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="vrBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140f1f"/>
      <stop offset="100%" stop-color="#0b0811"/>
    </linearGradient>
    <radialGradient id="hologram" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#140f1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <rect width="800" height="500" fill="url(#vrBg)"/>
  <circle cx="400" cy="230" r="180" fill="url(#hologram)"/>
  
  <rect x="30" y="30" width="740" height="440" rx="8" fill="none" stroke="#2e1065" stroke-width="1.5"/>
  <text x="50" y="60" font-family="monospace" font-size="12" fill="#c084fc">AIT AR/VR CLUB // DRISHYA // SPATIAL &amp; SHADER LAB</text>
  
  <!-- Wireframe 3D Cube / Spatial Headset Icon -->
  <g transform="translate(400, 220)">
    <!-- 3D Cube projection -->
    <path d="M 0 -80 L 70 -40 L 70 40 L 0 80 L -70 40 L -70 -40 Z" fill="none" stroke="#a855f7" stroke-width="2"/>
    <path d="M 0 -80 L 0 80 M 70 -40 L 0 0 L -70 -40 M 0 0 L 0 80" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#e879f9"/>
    
    <!-- Orbital Rings -->
    <ellipse cx="0" cy="0" rx="150" ry="50" fill="none" stroke="#7e22ce" stroke-width="1.5" stroke-dasharray="6,4" transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="170" ry="60" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4,6" transform="rotate(25)"/>
    
    <!-- Coordinate markers -->
    <text x="80" y="-35" font-family="monospace" font-size="10" fill="#e9d5ff">+X (Right)</text>
    <text x="-5" y="-90" font-family="monospace" font-size="10" fill="#e9d5ff">+Y (Up)</text>
    <text x="-120" y="35" font-family="monospace" font-size="10" fill="#e9d5ff">+Z (Forward)</text>
  </g>
  
  <text x="50" y="435" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">AIT AR/VR CLUB &amp; SPATIAL EXPERIMENTS</text>
  <text x="50" y="455" font-family="monospace" font-size="12" fill="#c084fc">Army Institute of Technology · Interactive 3D Graphics · Custom HLSL Shaders</text>
  <rect x="650" y="420" width="90" height="26" rx="4" fill="#2e1065" stroke="#a855f7" stroke-width="1"/>
  <text x="668" y="437" font-family="monospace" font-size="11" fill="#e879f9">ACTIVE</text>
</svg>