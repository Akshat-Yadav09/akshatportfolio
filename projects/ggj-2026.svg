<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#0a0a0c"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e06c75" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d19a66" stop-opacity="0.8"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#grid)"/>
  
  <!-- Frame & HUD border -->
  <rect x="30" y="30" width="740" height="440" rx="8" fill="none" stroke="#2c2d33" stroke-width="1.5"/>
  <circle cx="50" cy="50" r="4" fill="#e06c75"/>
  <circle cx="65" cy="50" r="4" fill="#d19a66"/>
  <circle cx="80" cy="50" r="4" fill="#98c379"/>
  
  <text x="105" y="54" font-family="monospace" font-size="12" fill="#6c6f7e">GGJ-2026 // 48H_TIME_ATTACK // PROTOTYPE_BRANCH</text>
  
  <!-- Pixel art / Retro gamepad & code elements -->
  <g transform="translate(140, 110)">
    <!-- Gamepad outline -->
    <rect x="0" y="30" width="520" height="250" rx="40" fill="#18191f" stroke="#3e404d" stroke-width="2"/>
    <rect x="40" y="90" width="40" height="120" rx="8" fill="#25262f"/>
    <rect x="0" y="130" width="120" height="40" rx="8" fill="#25262f"/>
    <!-- D-pad cross -->
    <path d="M 60 110 L 60 190 M 20 150 L 100 150" stroke="#4f5263" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Screen center -->
    <rect x="145" y="60" width="230" height="180" rx="10" fill="#0c0d10" stroke="#2d2f38" stroke-width="1.5"/>
    <text x="165" y="100" font-family="monospace" font-size="14" fill="#98c379">&gt; GGJ26.unity</text>
    <text x="165" y="125" font-family="monospace" font-size="12" fill="#e5c07b">[!] 48h Countdown</text>
    <text x="165" y="150" font-family="monospace" font-size="12" fill="#abb2bf">FPS: 60.0 | Physics: Fixed</text>
    <text x="165" y="175" font-family="monospace" font-size="12" fill="#61afef">Status: SHIPPED</text>
    <rect x="165" y="195" width="190" height="8" rx="4" fill="#25262f"/>
    <rect x="165" y="195" width="170" height="8" rx="4" fill="#98c379"/>
    
    <!-- Buttons A B X Y -->
    <circle cx="430" cy="115" r="16" fill="#e06c75" fill-opacity="0.9"/>
    <circle cx="465" cy="150" r="16" fill="#61afef" fill-opacity="0.9"/>
    <circle cx="395" cy="150" r="16" fill="#e5c07b" fill-opacity="0.9"/>
    <circle cx="430" cy="185" r="16" fill="#98c379" fill-opacity="0.9"/>
    <text x="425" y="120" font-family="monospace" font-weight="bold" font-size="14" fill="#000">Y</text>
    <text x="460" y="155" font-family="monospace" font-weight="bold" font-size="14" fill="#000">B</text>
    <text x="390" y="155" font-family="monospace" font-weight="bold" font-size="14" fill="#000">X</text>
    <text x="425" y="190" font-family="monospace" font-weight="bold" font-size="14" fill="#000">A</text>
  </g>
  
  <text x="50" y="435" font-family="monospace" font-size="18" font-weight="bold" fill="#ffffff">GLOBAL GAME JAM 2026</text>
  <text x="50" y="455" font-family="monospace" font-size="12" fill="#8c8f9f">IIT Guwahati STEM Jam · BYOG · IIITG · Rapid Unity Prototyping</text>
  <rect x="650" y="420" width="90" height="26" rx="4" fill="#282c34" stroke="#4f5263" stroke-width="1"/>
  <text x="665" y="437" font-family="monospace" font-size="11" fill="#98c379">48H BUILD</text>
</svg>